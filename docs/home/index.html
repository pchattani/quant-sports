<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Quant</title>
<meta name="description" content="A sports hub for quant fans: live scores, our win chances for every game, title races, player percentiles and the stats behind them across football, the NFL, NBA, MLB, NHL, F1, tennis and college sports.">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#08090d">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%239384ff'/%3E%3Cpath d='M6 23l7-9 5 4 8-11' stroke='%230c0820' stroke-width='3.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<script>try{var t=/[?&]theme=(light|dark)/.exec(location.search);t=t?t[1]:localStorage.getItem('qk-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/qk/tokens.css">
<link rel="stylesheet" href="assets/qk/quant.css">
<link rel="stylesheet" href="assets/home.css">
</head>
<body class="qk">
<div id="qk-shell"></div>
<div class="qk-ticker" id="ticker" aria-label="Scores and our chances"></div>

<main id="main" class="qk-page">
  <section class="hm-hero">
    <div class="hm-hero-main">
      <div class="qk-sh-kicker" id="hero-date">Today</div>
      <h1 class="hm-headline">Every game,<br><span>by the numbers.</span></h1>
      <p class="hm-lede">Live scores, our chance for every game, title races and the stats behind them, across eight sports. Built by quants, for fans.</p>
      <div id="hero-stats"><div class="qk-skel line"></div><div class="qk-skel line short"></div></div>
    </div>
    <div class="hm-hero-side">
      <div class="qk-card hm-feature" id="feature"><div class="qk-card-body"><div class="qk-skel line short"></div><div class="qk-skel block"></div></div></div>
      <div class="qk-card hm-stat" id="stat"></div>
    </div>
  </section>

  <section class="qk-section" id="sports">
    <div id="h-sports"></div>
    <div class="hm-tiles" id="tiles"></div>
  </section>

  <section class="qk-section" id="games">
    <div id="h-games"></div>
    <div class="qk-chips scroll" id="sport-chips" role="group" aria-label="Filter by sport"></div>
    <div class="qk-auto hm-games" id="game-grid" style="--min:290px;margin-top:14px"></div>
    <div class="hm-more" id="game-more"></div>
  </section>

  <section class="qk-section" id="futures">
    <div id="h-futures"></div>
    <div class="qk-card">
      <div class="qk-tabs" role="tablist" id="fut-tabs" style="padding:0 8px"></div>
      <div class="qk-card-body" id="fut-panels"></div>
    </div>
  </section>

  <section class="qk-section" id="charts">
    <div id="h-charts"></div>
    <div class="qk-grid" id="chart-grid"></div>
  </section>

  <section class="qk-section" id="leaders">
    <div id="h-leaders"></div>
    <div class="hm-leaders" id="leader-grid"></div>
  </section>

  <p class="qk-sub hm-updated" id="updated"></p>
</main>
<div id="qk-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js" defer></script>
<script src="assets/qk/quant.js" defer></script>
<script src="assets/qk/quant-charts.js" defer></script>
<script src="assets/home.js" defer></script>
</body>
</html>
