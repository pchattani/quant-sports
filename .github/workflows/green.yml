name: Green (golf)

# Generated by the engine's scripts/gen_ci_workflows.py; edit there. Builds and deploys The Quant Green (golf)
# to pchattani/the-quant-green (GitHub Pages). Deploys only when the repository variable DEPLOY_GREEN is 'true';
# otherwise (and for a dispatch with shadow ticked) it plans the deploy against the live site and uploads the
# comparison as an artifact. Raw data and model caches live in the Actions cache; nothing raw is committed.

on:
  schedule:
    - cron: '22 * * * *'
  repository_dispatch:
    types: [hourly]
  workflow_dispatch:
    inputs:
      shadow:
        description: 'Shadow run: build and compare with the live site, deploy nothing'
        type: boolean
        default: false

concurrency:
  group: green
  cancel-in-progress: false

permissions:
  contents: read
  actions: write      # prunecaches: delete this site's superseded Actions caches after a save

env:
  SITE: green
  PAGES_REPO: ${{ vars.GREEN_REPO || 'pchattani/the-quant-green' }}
  DEPLOY: ${{ vars.DEPLOY_GREEN == 'true' && !inputs.shadow }}
  PYTHONUNBUFFERED: '1'
  PYTHONIOENCODING: utf-8

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v5

      - name: 'Install uv and Python'
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'
          enable-cache: true

      - name: 'Install dependencies'
        run: |
          for i in 1 2 3; do
            uv sync --frozen && exit 0
            echo "uv sync failed (attempt $i of 3); retrying in 60 seconds"
            sleep 60
          done
          exit 1

      - name: 'Site context'
        id: ctx
        run: |
          uv run --frozen python scripts/ci_site.py ctx --site green | tee -a "$GITHUB_OUTPUT"

      - name: 'Restore raw data'
        id: raw
        uses: actions/cache/restore@v4
        with:
          path: |
            data/golf
          key: green-raw-v1-none
          restore-keys: green-raw-v1-

      - name: 'Clone the live site (restore source and deploy target)'
        run: |
          git clone -q --depth 1 "https://github.com/${PAGES_REPO}.git" "$RUNNER_TEMP/site"
          echo "live site: $(git -C "$RUNNER_TEMP/site" log -1 --format='%h %cI %s')"

      - name: 'Restore the previous deploy''s payloads and stores'
        run: |
          uv run --frozen python scripts/ci_site.py restore --site green --prev "$RUNNER_TEMP/site"

      - name: 'Seed the working set if the cache was cold'
        id: seed
        timeout-minutes: 40
        env:
          STORES_DEPLOY_KEY: ${{ secrets.STORES_DEPLOY_KEY }}
          STORES_REPO: ${{ vars.STORES_REPO || 'pchattani/quant-sports-stores' }}
        run: |
          uv run --frozen python scripts/ci_site.py seed --site green | tee "$RUNNER_TEMP/seed.out"
          grep -E "^seeded=(true|false)$" "$RUNNER_TEMP/seed.out" >> "$GITHUB_OUTPUT" || echo "seeded=false" >> "$GITHUB_OUTPUT"

      - name: 'Fetch (ESPN: this week''s scoreboards and leaderboards, the full season every 6 hours; season stats weekly; new players'' bios)'
        continue-on-error: true
        timeout-minutes: 10
        run: |
          uv run --frozen python scripts/golf_fetch.py --max-age-h 6 --budget 300 --stats --bios

      - name: 'Build'
        id: build
        timeout-minutes: 30
        run: |
          uv run --frozen python scripts/build_green.py

      - name: 'Completeness guard (refuse to deploy from an incomplete working set)'
        run: |
          uv run --frozen python scripts/ci_site.py guard --site green

      - name: 'Deploy'
        if: ${{ env.DEPLOY == 'true' }}
        env:
          DEPLOY_KEY: ${{ secrets.GREEN_DEPLOY_KEY }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then echo "::error::GREEN_DEPLOY_KEY not set"; exit 1; fi
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          git -C "$RUNNER_TEMP/site" remote set-url origin "git@github.com:${PAGES_REPO}.git"
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes"
          uv run --frozen python scripts/ci_site.py deploy --site green --clone "$RUNNER_TEMP/site"

      - name: 'Shadow run: compare with the live site'
        if: ${{ env.DEPLOY != 'true' }}
        run: |
          uv run --frozen python scripts/ci_site.py deploy --site green --clone "$RUNNER_TEMP/site" --shadow "$RUNNER_TEMP/shadow"

      - name: 'Upload the shadow report'
        if: ${{ env.DEPLOY != 'true' && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: shadow-green-${{ github.run_id }}
          path: ${{ runner.temp }}/shadow
          retention-days: 3
          if-no-files-found: ignore

      - name: 'Raw data content key'
        if: ${{ !cancelled() }}
        id: rawkey
        run: |
          uv run --frozen python scripts/ci_site.py cachekey --name green-raw-v1 --paths data/golf | tee -a "$GITHUB_OUTPUT"

      - name: 'Save raw data (only when it changed)'
        if: ${{ !cancelled() && steps.rawkey.outputs.files != '0' && steps.rawkey.outputs.key != steps.raw.outputs.cache-matched-key }}
        id: rawsave
        uses: actions/cache/save@v4
        with:
          path: |
            data/golf
          key: ${{ steps.rawkey.outputs.key }}

      - name: 'Delete superseded raw-data caches'
        if: ${{ !cancelled() && steps.rawkey.outputs.files != '0' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          uv run --frozen python scripts/ci_site.py prunecaches --prefix green-raw-v1- --keep "${{ steps.rawkey.outputs.key }}"
