name: Home (The Quant Sports)

# Generated by the engine's scripts/gen_ci_workflows.py; edit there. Builds the landing page (docs/home, from
# scripts/build_home.py and the design kit docs/_design) and deploys it to the home Pages repo. Static: it runs
# when the home or the design kit changes, every six hours (it reads the sites' live headlines), or by hand.

on:
  push:
    branches: [main]
    paths: ['docs/home/**', 'docs/_design/**', 'scripts/build_home.py', 'scripts/design_kit.py']
  schedule:
    - cron: '41 */6 * * *'
  workflow_dispatch:
    inputs:
      shadow:
        description: 'Shadow run: build and compare with the live site, deploy nothing'
        type: boolean
        default: false

concurrency:
  group: home
  cancel-in-progress: false

permissions:
  contents: read

env:
  PAGES_REPO: ${{ vars.HOME_REPO || 'pchattani/the-quant' }}
  DEPLOY: ${{ vars.DEPLOY_HOME == 'true' && !inputs.shadow }}
  PYTHONIOENCODING: utf-8

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      # build_home.py reads each sport's built summaries from docs/<site>/data; in CI they come from the live sites
      - name: Fetch the sites' published summaries
        run: |
          get() { mkdir -p "docs/$1/data"; curl -fsSL --retry 3 --create-dirs -o "docs/$1/data/$3" "https://pchattani.github.io/$2/data/$3" || echo "::warning::$2/data/$3 not read"; }
          for f in hub.json competitions.json clubs_index.json; do get site the-quant-footballer "$f"; done
          for f in index.json markets.json; do get paddock the-quant-paddock "$f"; done
          get hardwood the-quant-hardwood index.json
          get ace the-quant-ace index.json
          for f in index.json players_index.json; do get bullpen the-quant-bullpen "$f"; get gridiron the-quant-gridiron "$f"; get rink the-quant-rink "$f"; done
          for f in index.json search.json; do get campus the-quant-campus "$f"; done
          # files whose path depends on the current season (F1/NBA/NFL/NHL season.json, football title races)
          uv run --frozen python scripts/build_home.py --season-files | while read -r a b c; do get "$a" "$b" "$c"; done

      - name: Build
        run: uv run --frozen python scripts/build_home.py

      - name: Deploy
        env:
          DEPLOY_KEY: ${{ secrets.HOME_DEPLOY_KEY }}
        run: |
          git clone -q --depth 1 "https://github.com/${PAGES_REPO}.git" "$RUNNER_TEMP/site"
          if [ "$DEPLOY" != "true" ]; then
            rsync -a --delete --exclude='.git' --dry-run --itemize-changes docs/home/ "$RUNNER_TEMP/site/" | head -200
            echo "shadow run: nothing pushed"; exit 0
          fi
          if [ -z "$DEPLOY_KEY" ]; then echo "::error::HOME_DEPLOY_KEY not set"; exit 1; fi
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          rsync -a --delete --exclude='.git' docs/home/ "$RUNNER_TEMP/site/"
          touch "$RUNNER_TEMP/site/.nojekyll"
          cd "$RUNNER_TEMP/site"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git remote set-url origin "git@github.com:${PAGES_REPO}.git"
          git add -A .
          if git diff --cached --quiet; then echo "unchanged"; exit 0; fi
          git commit -q -m "Site update $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          GIT_SSH_COMMAND="ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes" git push -q origin HEAD:main
