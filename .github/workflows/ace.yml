name: Ace (tennis)

# Generated by the engine's scripts/gen_ci_workflows.py; edit there. Builds and deploys The Quant Ace (tennis)
# to pchattani/the-quant-ace (GitHub Pages). Deploys only when the repository variable DEPLOY_ACE is 'true';
# otherwise (and for a dispatch with shadow ticked) it plans the deploy against the live site and uploads the
# comparison as an artifact. Raw data and model caches live in the Actions cache; nothing raw is committed.

on:
  schedule:
    - cron: '27 * * * *'
  workflow_dispatch:
    inputs:
      shadow:
        description: 'Shadow run: build and compare with the live site, deploy nothing'
        type: boolean
        default: false

concurrency:
  group: ace
  cancel-in-progress: false

permissions:
  contents: read

env:
  SITE: ace
  PAGES_REPO: ${{ vars.ACE_REPO || 'pchattani/the-quant-ace' }}
  DEPLOY: ${{ vars.DEPLOY_ACE == 'true' && !inputs.shadow }}
  PYTHONUNBUFFERED: '1'
  PYTHONIOENCODING: utf-8

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v5

      - name: 'Install uv and Python'
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'
          enable-cache: true

      - name: 'Install dependencies'
        run: |
          uv sync --frozen

      - name: 'Site context'
        id: ctx
        run: |
          uv run --frozen python scripts/ci_site.py ctx --site ace | tee -a "$GITHUB_OUTPUT"

      - name: 'Restore raw data'
        id: raw
        uses: actions/cache/restore@v4
        with:
          path: |
            data/tennis/td
            data/tennis/wta
            data/tennis/charting
          key: ace-raw-v1-none
          restore-keys: ace-raw-v1-

      - name: 'Restore model caches'
        id: model
        uses: actions/cache/restore@v4
        with:
          path: |
            data/tennis/cache
          key: ace-model-v1-${{ steps.ctx.outputs.today }}
          restore-keys: ace-model-v1-

      - name: 'Clone the live site (restore source and deploy target)'
        run: |
          git clone -q --depth 1 "https://github.com/${PAGES_REPO}.git" "$RUNNER_TEMP/site"
          echo "live site: $(git -C "$RUNNER_TEMP/site" log -1 --format='%h %cI %s')"

      - name: 'Restore the previous deploy''s payloads and stores'
        run: |
          uv run --frozen python scripts/ci_site.py restore --site ace --prev "$RUNNER_TEMP/site"

      - name: 'Hydrate the current season from the deployed site'
        continue-on-error: true
        timeout-minutes: 5
        run: |
          uv run --frozen python scripts/tn_hydrate.py

      - name: 'Seed the working set if the cache was cold'
        timeout-minutes: 40
        env:
          STORES_DEPLOY_KEY: ${{ secrets.STORES_DEPLOY_KEY }}
          STORES_REPO: ${{ vars.STORES_REPO || 'pchattani/quant-sports-stores' }}
        run: |
          uv run --frozen python scripts/ci_site.py seed --site ace

      - name: 'Inputs the PC fetches (sources that block datacenter addresses)'
        env:
          STORES_DEPLOY_KEY: ${{ secrets.STORES_DEPLOY_KEY }}
          STORES_REPO: ${{ vars.STORES_REPO || 'pchattani/quant-sports-stores' }}
        run: |
          uv run --frozen python scripts/ci_site.py feed --site ace

      - name: 'Fetch ATP (ESPN, tennis-data, rankings)'
        continue-on-error: true
        timeout-minutes: 15
        run: |
          uv run --frozen python scripts/tn_fetch.py --tour atp --refresh-current --budget 300 --interval 0.5

      - name: 'Fetch WTA (ESPN, WTA API, tennis-data, rankings)'
        continue-on-error: true
        timeout-minutes: 15
        run: |
          uv run --frozen python scripts/tn_fetch.py --tour wta --refresh-current --budget 400 --interval 0.5

      - name: 'Build'
        timeout-minutes: 40
        env:
          ACE_SR_FIT_BUDGET: '600'
        run: |
          uv run --frozen python scripts/build_ace.py --match-page-years 2

      - name: 'Completeness guard (refuse to deploy from an incomplete working set)'
        run: |
          uv run --frozen python scripts/ci_site.py guard --site ace

      - name: 'Deploy'
        if: ${{ env.DEPLOY == 'true' }}
        env:
          DEPLOY_KEY: ${{ secrets.ACE_DEPLOY_KEY }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then echo "::error::ACE_DEPLOY_KEY not set"; exit 1; fi
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          git -C "$RUNNER_TEMP/site" remote set-url origin "git@github.com:${PAGES_REPO}.git"
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes"
          uv run --frozen python scripts/ci_site.py deploy --site ace --clone "$RUNNER_TEMP/site"

      - name: 'Shadow run: compare with the live site'
        if: ${{ env.DEPLOY != 'true' }}
        run: |
          uv run --frozen python scripts/ci_site.py deploy --site ace --clone "$RUNNER_TEMP/site" --shadow "$RUNNER_TEMP/shadow"

      - name: 'Upload the shadow report'
        if: ${{ env.DEPLOY != 'true' && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: shadow-ace-${{ github.run_id }}
          path: ${{ runner.temp }}/shadow
          retention-days: 3
          if-no-files-found: ignore

      - name: 'Raw data content key'
        if: ${{ !cancelled() }}
        id: rawkey
        run: |
          uv run --frozen python scripts/ci_site.py cachekey --name ace-raw-v1 --paths data/tennis/td data/tennis/wta data/tennis/charting | tee -a "$GITHUB_OUTPUT"

      - name: 'Save raw data (only when it changed)'
        if: ${{ !cancelled() && steps.rawkey.outputs.files != '0' && steps.rawkey.outputs.key != steps.raw.outputs.cache-matched-key }}
        uses: actions/cache/save@v4
        with:
          path: |
            data/tennis/td
            data/tennis/wta
            data/tennis/charting
          key: ${{ steps.rawkey.outputs.key }}

      - name: 'Save model caches (once a day)'
        if: ${{ !cancelled() && steps.model.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            data/tennis/cache
          key: ace-model-v1-${{ steps.ctx.outputs.today }}
