name: Footballer

# Generated by the engine's scripts/gen_ci_workflows.py; edit there. Builds and deploys The Quant Footballer
# to pchattani/the-quant-footballer (GitHub Pages). Deploys only when the repository variable DEPLOY_FOOTBALL is 'true';
# otherwise (and for a dispatch with shadow ticked) it plans the deploy against the live site and uploads the
# comparison as an artifact. Raw data and model caches live in the Actions cache; nothing raw is committed.

on:
  schedule:
    - cron: '17 * * * *'
  repository_dispatch:
    types: [stores-updated]
  workflow_dispatch:
    inputs:
      shadow:
        description: 'Shadow run: build and compare with the live site, deploy nothing'
        type: boolean
        default: false

concurrency:
  group: football
  cancel-in-progress: false

permissions:
  contents: read
  actions: write      # prunecaches: delete this site's superseded Actions caches after a save

env:
  SITE: football
  PAGES_REPO: ${{ vars.FOOTBALL_REPO || 'pchattani/the-quant-footballer' }}
  DEPLOY: ${{ vars.DEPLOY_FOOTBALL == 'true' && !inputs.shadow }}
  PYTHONUNBUFFERED: '1'
  PYTHONIOENCODING: utf-8

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v5

      - name: 'Install uv and Python'
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'
          enable-cache: true

      - name: 'Install dependencies'
        run: |
          uv sync --frozen

      - name: 'Site context'
        id: ctx
        run: |
          uv run --frozen python scripts/ci_site.py ctx --site football | tee -a "$GITHUB_OUTPUT"

      - name: 'Read the football stores (private stores repo, read-only deploy key)'
        env:
          STORES_DEPLOY_KEY: ${{ secrets.STORES_DEPLOY_KEY }}
          STORES_REPO: ${{ vars.STORES_REPO || 'pchattani/quant-sports-stores' }}
        run: |
          if [ -z "$STORES_DEPLOY_KEY" ]; then echo "::error::STORES_DEPLOY_KEY not set"; exit 1; fi
          mkdir -p ~/.ssh
          echo "$STORES_DEPLOY_KEY" | base64 -d > ~/.ssh/stores_key
          chmod 600 ~/.ssh/stores_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          GIT_SSH_COMMAND="ssh -i ~/.ssh/stores_key -o IdentitiesOnly=yes" git clone -q --depth 1 "git@github.com:${STORES_REPO}.git" "$RUNNER_TEMP/stores"
          rm -f ~/.ssh/stores_key
          cd "$RUNNER_TEMP/stores"
          echo "stores commit: $(git log -1 --format='%h %cI %s')"
          # the competition stores, Liga Profesional's and the Sofascore ids discovered on the PC
          find docs -name store.json -o -name liga_store.json | while read -r f; do mkdir -p "$GITHUB_WORKSPACE/$(dirname "$f")"; cp "$f" "$GITHUB_WORKSPACE/$f"; done
          cp oddsmarkets/football/competitions/league/data/seasons.json "$GITHUB_WORKSPACE/oddsmarkets/football/competitions/league/data/seasons.json"
          echo "stores: $(find docs -name store.json | wc -l) competition stores"

      - name: 'Restore the title-odds history stores'
        id: hist
        uses: actions/cache/restore@v4
        with:
          path: docs/site/data/*/history_store.json
          key: football-history-v1-none
          restore-keys: football-history-v1-

      - name: 'History stores the cache does not have come from the stores repo (the PC''s copies)'
        run: |
          cd "$RUNNER_TEMP/stores"
          n=0
          for f in $(find docs -name history_store.json); do
            if [ ! -f "$GITHUB_WORKSPACE/$f" ]; then mkdir -p "$GITHUB_WORKSPACE/$(dirname "$f")"; cp "$f" "$GITHUB_WORKSPACE/$f"; n=$((n+1)); fi
          done
          echo "history stores seeded from the stores repo: $n"

      - name: 'Restore raw data'
        id: raw
        uses: actions/cache/restore@v4
        with:
          path: |
            data/football/odds/raw
            data/football/odds/kalshi
          key: football-raw-v1-none
          restore-keys: football-raw-v1-

      - name: 'Clone the live site (restore source and deploy target)'
        run: |
          git clone -q --depth 1 "https://github.com/${PAGES_REPO}.git" "$RUNNER_TEMP/site"
          echo "live site: $(git -C "$RUNNER_TEMP/site" log -1 --format='%h %cI %s')"

      - name: 'Restore the persistent logs from the previous deploy'
        run: |
          uv run --frozen python scripts/ci_site.py restore --site football --prev "$RUNNER_TEMP/site"

      - name: 'Seed the working set if the cache was cold'
        id: seed
        timeout-minutes: 40
        env:
          STORES_DEPLOY_KEY: ${{ secrets.STORES_DEPLOY_KEY }}
          STORES_REPO: ${{ vars.STORES_REPO || 'pchattani/quant-sports-stores' }}
        run: |
          uv run --frozen python scripts/ci_site.py seed --site football | tee "$RUNNER_TEMP/seed.out"
          grep -E "^seeded=(true|false)$" "$RUNNER_TEMP/seed.out" >> "$GITHUB_OUTPUT" || echo "seeded=false" >> "$GITHUB_OUTPUT"

      - name: 'Build every competition'
        id: build
        timeout-minutes: 100
        run: |
          uv run --frozen python scripts/build_site_all.py --sims 30000

      - name: 'Completeness guard (refuse to deploy from an incomplete working set)'
        run: |
          uv run --frozen python scripts/ci_site.py guard --site football

      - name: 'Deploy'
        if: ${{ env.DEPLOY == 'true' }}
        env:
          DEPLOY_KEY: ${{ secrets.FOOTBALL_DEPLOY_KEY }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then echo "::error::FOOTBALL_DEPLOY_KEY not set"; exit 1; fi
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          git -C "$RUNNER_TEMP/site" remote set-url origin "git@github.com:${PAGES_REPO}.git"
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes"
          uv run --frozen python scripts/ci_site.py deploy --site football --clone "$RUNNER_TEMP/site"

      - name: 'Shadow run: compare with the live site'
        if: ${{ env.DEPLOY != 'true' }}
        run: |
          uv run --frozen python scripts/ci_site.py deploy --site football --clone "$RUNNER_TEMP/site" --shadow "$RUNNER_TEMP/shadow"

      - name: 'Upload the shadow report'
        if: ${{ env.DEPLOY != 'true' && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: shadow-football-${{ github.run_id }}
          path: ${{ runner.temp }}/shadow
          retention-days: 3
          if-no-files-found: ignore

      - name: 'Raw data content key'
        if: ${{ !cancelled() }}
        id: rawkey
        run: |
          uv run --frozen python scripts/ci_site.py cachekey --name football-raw-v1 --paths data/football/odds/raw data/football/odds/kalshi | tee -a "$GITHUB_OUTPUT"

      - name: 'Save raw data (only when it changed)'
        if: ${{ !cancelled() && steps.rawkey.outputs.files != '0' && steps.rawkey.outputs.key != steps.raw.outputs.cache-matched-key }}
        id: rawsave
        uses: actions/cache/save@v4
        with:
          path: |
            data/football/odds/raw
            data/football/odds/kalshi
          key: ${{ steps.rawkey.outputs.key }}

      - name: 'Delete superseded raw-data caches'
        if: ${{ !cancelled() && steps.rawkey.outputs.files != '0' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          uv run --frozen python scripts/ci_site.py prunecaches --prefix football-raw-v1- --keep "${{ steps.rawkey.outputs.key }}"

      - name: 'History stores content key'
        if: ${{ !cancelled() }}
        id: histkey
        run: |
          uv run --frozen python scripts/ci_site.py cachekey --name football-history-v1 --paths docs/site/data | tee -a "$GITHUB_OUTPUT"

      - name: 'Save the title-odds history stores'
        if: ${{ !cancelled() && steps.hist.outputs.cache-matched-key != steps.histkey.outputs.key }}
        id: histsave
        uses: actions/cache/save@v4
        with:
          path: docs/site/data/*/history_store.json
          key: ${{ steps.histkey.outputs.key }}

      - name: 'Delete superseded history-store caches'
        if: ${{ !cancelled() && steps.histkey.outputs.files != '0' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          uv run --frozen python scripts/ci_site.py prunecaches --prefix football-history-v1- --keep "${{ steps.histkey.outputs.key }}"
