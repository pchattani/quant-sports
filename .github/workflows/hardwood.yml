name: Hardwood (NBA, WNBA)

# Generated by the engine's scripts/gen_ci_workflows.py; edit there. Builds and deploys The Quant Hardwood (NBA, WNBA)
# to pchattani/the-quant-hardwood (GitHub Pages). Deploys only when the repository variable DEPLOY_HARDWOOD is 'true';
# otherwise (and for a dispatch with shadow ticked) it plans the deploy against the live site and uploads the
# comparison as an artifact. Raw data and model caches live in the Actions cache; nothing raw is committed.

on:
  schedule:
    - cron: '47 * * * *'
  repository_dispatch:
    types: [hourly]
  workflow_dispatch:
    inputs:
      shadow:
        description: 'Shadow run: build and compare with the live site, deploy nothing'
        type: boolean
        default: false

concurrency:
  group: hardwood
  cancel-in-progress: false

permissions:
  contents: read
  actions: write      # prunecaches: delete this site's superseded Actions caches after a save

env:
  SITE: hardwood
  PAGES_REPO: ${{ vars.HARDWOOD_REPO || 'pchattani/the-quant-hardwood' }}
  DEPLOY: ${{ vars.DEPLOY_HARDWOOD == 'true' && !inputs.shadow }}
  PYTHONUNBUFFERED: '1'
  PYTHONIOENCODING: utf-8

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v5

      - name: 'Install uv and Python'
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'
          enable-cache: true

      - name: 'Install dependencies'
        run: |
          uv sync --frozen

      - name: 'Site context'
        id: ctx
        run: |
          uv run --frozen python scripts/ci_site.py ctx --site hardwood | tee -a "$GITHUB_OUTPUT"

      - name: 'Restore raw data'
        id: raw
        uses: actions/cache/restore@v4
        with:
          path: |
            data/basketball/pbp
          key: hardwood-raw-v1-none
          restore-keys: hardwood-raw-v1-

      - name: 'Restore model caches'
        id: model
        uses: actions/cache/restore@v4
        with:
          path: |
            data/basketball/cache
          key: hardwood-model-v1-none
          restore-keys: hardwood-model-v1-

      - name: 'Clone the live site (restore source and deploy target)'
        run: |
          git clone -q --depth 1 "https://github.com/${PAGES_REPO}.git" "$RUNNER_TEMP/site"
          echo "live site: $(git -C "$RUNNER_TEMP/site" log -1 --format='%h %cI %s')"

      - name: 'Restore the previous deploy''s payloads and stores'
        run: |
          uv run --frozen python scripts/ci_site.py restore --site hardwood --prev "$RUNNER_TEMP/site"

      - name: 'Hydrate the current season from the deployed site'
        continue-on-error: true
        timeout-minutes: 5
        run: |
          uv run --frozen python scripts/bb_hydrate.py

      - name: 'Seed the working set if the cache was cold'
        id: seed
        timeout-minutes: 40
        env:
          STORES_DEPLOY_KEY: ${{ secrets.STORES_DEPLOY_KEY }}
          STORES_REPO: ${{ vars.STORES_REPO || 'pchattani/quant-sports-stores' }}
        run: |
          uv run --frozen python scripts/ci_site.py seed --site hardwood | tee "$RUNNER_TEMP/seed.out"
          grep -E "^seeded=(true|false)$" "$RUNNER_TEMP/seed.out" >> "$GITHUB_OUTPUT" || echo "seeded=false" >> "$GITHUB_OUTPUT"

      - name: 'Fetch NBA (ESPN)'
        if: ${{ steps.ctx.outputs.nba == 'true' }}
        continue-on-error: true
        timeout-minutes: 15
        run: |
          uv run --frozen python scripts/bb_fetch.py --league nba --refresh-current --budget 600 --interval 0.5

      - name: 'Fetch WNBA (ESPN)'
        if: ${{ steps.ctx.outputs.wnba == 'true' }}
        continue-on-error: true
        timeout-minutes: 15
        run: |
          uv run --frozen python scripts/bb_fetch.py --league wnba --refresh-current --budget 400 --interval 0.5

      - name: 'Derive shots and stints (NBA)'
        if: ${{ steps.ctx.outputs.nba == 'true' }}
        continue-on-error: true
        timeout-minutes: 10
        run: |
          uv run --frozen python scripts/bb_derive.py --league nba

      - name: 'Derive shots and stints (WNBA)'
        if: ${{ steps.ctx.outputs.wnba == 'true' }}
        continue-on-error: true
        timeout-minutes: 10
        run: |
          uv run --frozen python scripts/bb_derive.py --league wnba

      - name: 'Build'
        id: build
        timeout-minutes: 60
        run: |
          uv run --frozen python scripts/build_hardwood.py --game-page-seasons 3

      - name: 'Completeness guard (refuse to deploy from an incomplete working set)'
        run: |
          uv run --frozen python scripts/ci_site.py guard --site hardwood

      - name: 'Deploy'
        if: ${{ env.DEPLOY == 'true' }}
        env:
          DEPLOY_KEY: ${{ secrets.HARDWOOD_DEPLOY_KEY }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then echo "::error::HARDWOOD_DEPLOY_KEY not set"; exit 1; fi
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          git -C "$RUNNER_TEMP/site" remote set-url origin "git@github.com:${PAGES_REPO}.git"
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes"
          uv run --frozen python scripts/ci_site.py deploy --site hardwood --clone "$RUNNER_TEMP/site"

      - name: 'Shadow run: compare with the live site'
        if: ${{ env.DEPLOY != 'true' }}
        run: |
          uv run --frozen python scripts/ci_site.py deploy --site hardwood --clone "$RUNNER_TEMP/site" --shadow "$RUNNER_TEMP/shadow"

      - name: 'Upload the shadow report'
        if: ${{ env.DEPLOY != 'true' && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: shadow-hardwood-${{ github.run_id }}
          path: ${{ runner.temp }}/shadow
          retention-days: 3
          if-no-files-found: ignore

      - name: 'Raw data content key'
        if: ${{ !cancelled() }}
        id: rawkey
        run: |
          uv run --frozen python scripts/ci_site.py cachekey --name hardwood-raw-v1 --paths data/basketball/pbp | tee -a "$GITHUB_OUTPUT"

      - name: 'Save raw data (only when it changed)'
        if: ${{ !cancelled() && steps.rawkey.outputs.files != '0' && steps.rawkey.outputs.key != steps.raw.outputs.cache-matched-key }}
        id: rawsave
        uses: actions/cache/save@v4
        with:
          path: |
            data/basketball/pbp
          key: ${{ steps.rawkey.outputs.key }}

      - name: 'Delete superseded raw-data caches'
        if: ${{ !cancelled() && steps.rawkey.outputs.files != '0' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          uv run --frozen python scripts/ci_site.py prunecaches --prefix hardwood-raw-v1- --keep "${{ steps.rawkey.outputs.key }}"

      - name: 'Save model caches (once a day, after a seed, and after a failed or partial-cache build)'
        if: ${{ !cancelled() && (!startsWith(steps.model.outputs.cache-matched-key, format('hardwood-model-v1-{0}', steps.ctx.outputs.today)) || steps.seed.outputs.seeded == 'true' || steps.build.outcome == 'failure' || contains(steps.model.outputs.cache-matched-key, '-partial-')) }}
        id: modelsave
        uses: actions/cache/save@v4
        with:
          path: |
            data/basketball/cache
          key: hardwood-model-v1-${{ steps.ctx.outputs.today }}${{ steps.seed.outputs.seeded == 'true' && format('-seed-{0}', github.run_id) || (steps.build.outcome == 'failure' && format('-partial-{0}', github.run_id) || (contains(steps.model.outputs.cache-matched-key, '-partial-') && format('-r{0}', github.run_id) || '')) }}

      - name: 'Delete superseded model caches'
        if: ${{ !cancelled() && (steps.modelsave.outcome == 'success' || steps.model.outputs.cache-matched-key != '') }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          uv run --frozen python scripts/ci_site.py prunecaches --prefix hardwood-model-v1- --keep "${{ steps.modelsave.outcome == 'success' && format('hardwood-model-v1-{0}{1}', steps.ctx.outputs.today, steps.seed.outputs.seeded == 'true' && format('-seed-{0}', github.run_id) || (steps.build.outcome == 'failure' && format('-partial-{0}', github.run_id) || (contains(steps.model.outputs.cache-matched-key, '-partial-') && format('-r{0}', github.run_id) || ''))) || steps.model.outputs.cache-matched-key }}"
