name: Gridiron (NFL)

# Generated by the engine's scripts/gen_ci_workflows.py; edit there. Builds and deploys The Quant Gridiron (NFL)
# to pchattani/the-quant-gridiron (GitHub Pages). Deploys only when the repository variable DEPLOY_GRIDIRON is 'true';
# otherwise (and for a dispatch with shadow ticked) it plans the deploy against the live site and uploads the
# comparison as an artifact. Raw data and model caches live in the Actions cache; nothing raw is committed.

on:
  schedule:
    - cron: '52 * * * *'
    - cron: '7,22,37 * * * *'
  workflow_dispatch:
    inputs:
      shadow:
        description: 'Shadow run: build and compare with the live site, deploy nothing'
        type: boolean
        default: false

concurrency:
  group: gridiron
  cancel-in-progress: false

permissions:
  contents: read

env:
  SITE: gridiron
  PAGES_REPO: ${{ vars.GRIDIRON_REPO || 'pchattani/the-quant-gridiron' }}
  DEPLOY: ${{ vars.DEPLOY_GRIDIRON == 'true' && !inputs.shadow }}
  PYTHONUNBUFFERED: '1'
  PYTHONIOENCODING: utf-8

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Game-window check
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT" != "schedule" ] || [ "$CRON" = "52 * * * *" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "hourly or dispatched run"; exit 0
          fi
          curl -fsSL -o /tmp/ci_site.py "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/scripts/ci_site.py"
          python3 /tmp/ci_site.py gate --site "$SITE" >> "$GITHUB_OUTPUT"

      - name: 'Checkout'
        if: ${{ steps.gate.outputs.run == 'true' }}
        uses: actions/checkout@v5

      - name: 'Install uv and Python'
        if: ${{ steps.gate.outputs.run == 'true' }}
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'
          enable-cache: true

      - name: 'Install dependencies'
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: |
          uv sync --frozen

      - name: 'Site context'
        if: ${{ steps.gate.outputs.run == 'true' }}
        id: ctx
        run: |
          uv run --frozen python scripts/ci_site.py ctx --site gridiron | tee -a "$GITHUB_OUTPUT"

      - name: 'Restore raw data'
        if: ${{ steps.gate.outputs.run == 'true' }}
        id: raw
        uses: actions/cache/restore@v4
        with:
          path: |
            data/nfl/raw
            data/nfl/derived
          key: gridiron-raw-v1-none
          restore-keys: gridiron-raw-v1-

      - name: 'Restore model caches'
        if: ${{ steps.gate.outputs.run == 'true' }}
        id: model
        uses: actions/cache/restore@v4
        with:
          path: |
            data/nfl/cache
          key: gridiron-model-v1-${{ steps.ctx.outputs.today }}
          restore-keys: gridiron-model-v1-

      - name: 'Clone the live site (restore source and deploy target)'
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: |
          git clone -q --depth 1 "https://github.com/${PAGES_REPO}.git" "$RUNNER_TEMP/site"
          echo "live site: $(git -C "$RUNNER_TEMP/site" log -1 --format='%h %cI %s')"

      - name: 'Restore the previous deploy''s payloads and stores'
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: |
          uv run --frozen python scripts/ci_site.py restore --site gridiron --prev "$RUNNER_TEMP/site"

      - name: 'Hydrate the current season from the deployed site'
        if: ${{ steps.gate.outputs.run == 'true' }}
        continue-on-error: true
        timeout-minutes: 5
        run: |
          uv run --frozen python scripts/nfl_hydrate.py

      - name: 'Seed the working set if the cache was cold'
        if: ${{ steps.gate.outputs.run == 'true' }}
        id: seed
        timeout-minutes: 40
        env:
          STORES_DEPLOY_KEY: ${{ secrets.STORES_DEPLOY_KEY }}
          STORES_REPO: ${{ vars.STORES_REPO || 'pchattani/quant-sports-stores' }}
        run: |
          uv run --frozen python scripts/ci_site.py seed --site gridiron | tee "$RUNNER_TEMP/seed.out"
          grep -E "^seeded=(true|false)$" "$RUNNER_TEMP/seed.out" >> "$GITHUB_OUTPUT" || echo "seeded=false" >> "$GITHUB_OUTPUT"

      - name: 'Fetch (nflverse timestamp-gated, store, plays, ESPN odds and live)'
        if: ${{ steps.gate.outputs.run == 'true' }}
        continue-on-error: true
        timeout-minutes: 20
        run: |
          uv run --frozen python scripts/nfl_fetch.py --refresh-current --espn --budget 1500

      - name: 'Build'
        if: ${{ steps.gate.outputs.run == 'true' }}
        timeout-minutes: 40
        run: |
          uv run --frozen python scripts/build_gridiron.py --game-page-seasons 2

      - name: 'Completeness guard (refuse to deploy from an incomplete working set)'
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: |
          uv run --frozen python scripts/ci_site.py guard --site gridiron

      - name: 'Deploy'
        if: ${{ (steps.gate.outputs.run == 'true') && (env.DEPLOY == 'true') }}
        env:
          DEPLOY_KEY: ${{ secrets.GRIDIRON_DEPLOY_KEY }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then echo "::error::GRIDIRON_DEPLOY_KEY not set"; exit 1; fi
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          git -C "$RUNNER_TEMP/site" remote set-url origin "git@github.com:${PAGES_REPO}.git"
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes"
          uv run --frozen python scripts/ci_site.py deploy --site gridiron --clone "$RUNNER_TEMP/site"

      - name: 'Shadow run: compare with the live site'
        if: ${{ (steps.gate.outputs.run == 'true') && (env.DEPLOY != 'true') }}
        run: |
          uv run --frozen python scripts/ci_site.py deploy --site gridiron --clone "$RUNNER_TEMP/site" --shadow "$RUNNER_TEMP/shadow"

      - name: 'Upload the shadow report'
        if: ${{ (steps.gate.outputs.run == 'true') && (env.DEPLOY != 'true' && !cancelled()) }}
        uses: actions/upload-artifact@v4
        with:
          name: shadow-gridiron-${{ github.run_id }}
          path: ${{ runner.temp }}/shadow
          retention-days: 3
          if-no-files-found: ignore

      - name: 'Raw data content key'
        if: ${{ (steps.gate.outputs.run == 'true') && (!cancelled()) }}
        id: rawkey
        run: |
          uv run --frozen python scripts/ci_site.py cachekey --name gridiron-raw-v1 --paths data/nfl/raw data/nfl/derived | tee -a "$GITHUB_OUTPUT"

      - name: 'Save raw data (only when it changed)'
        if: ${{ (steps.gate.outputs.run == 'true') && (!cancelled() && steps.rawkey.outputs.files != '0' && steps.rawkey.outputs.key != steps.raw.outputs.cache-matched-key) }}
        uses: actions/cache/save@v4
        with:
          path: |
            data/nfl/raw
            data/nfl/derived
          key: ${{ steps.rawkey.outputs.key }}

      - name: 'Save model caches (once a day, and after a seed)'
        if: ${{ (steps.gate.outputs.run == 'true') && (!cancelled() && (steps.model.outputs.cache-hit != 'true' || steps.seed.outputs.seeded == 'true')) }}
        uses: actions/cache/save@v4
        with:
          path: |
            data/nfl/cache
          key: gridiron-model-v1-${{ steps.ctx.outputs.today }}${{ steps.seed.outputs.seeded == 'true' && format('-seed-{0}', github.run_id) || '' }}
