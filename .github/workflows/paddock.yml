name: Paddock (F1)

# Generated by the engine's scripts/gen_ci_workflows.py; edit there. Builds and deploys The Quant Paddock (F1)
# to pchattani/the-quant-paddock (GitHub Pages). Deploys only when the repository variable DEPLOY_PADDOCK is 'true';
# otherwise (and for a dispatch with shadow ticked) it plans the deploy against the live site and uploads the
# comparison as an artifact. Raw data and model caches live in the Actions cache; nothing raw is committed.

on:
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:
    inputs:
      shadow:
        description: 'Shadow run: build and compare with the live site, deploy nothing'
        type: boolean
        default: false

concurrency:
  group: paddock
  cancel-in-progress: false

permissions:
  contents: read

env:
  SITE: paddock
  PAGES_REPO: ${{ vars.PADDOCK_REPO || 'pchattani/the-quant-paddock' }}
  DEPLOY: ${{ vars.DEPLOY_PADDOCK == 'true' && !inputs.shadow }}
  PYTHONUNBUFFERED: '1'
  PYTHONIOENCODING: utf-8

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v5

      - name: 'Install uv and Python'
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'
          enable-cache: true

      - name: 'Install dependencies'
        run: |
          uv sync --frozen

      - name: 'Site context'
        id: ctx
        run: |
          uv run --frozen python scripts/ci_site.py ctx --site paddock | tee -a "$GITHUB_OUTPUT"

      - name: 'Restore raw data'
        id: raw
        uses: actions/cache/restore@v4
        with:
          path: |
            data/f1/telemetry
          key: paddock-raw-v1-none
          restore-keys: paddock-raw-v1-

      - name: 'Restore model caches'
        id: model
        uses: actions/cache/restore@v4
        with:
          path: |
            data/f1/cache
          key: paddock-model-v1-${{ steps.ctx.outputs.today }}
          restore-keys: paddock-model-v1-

      - name: 'Clone the live site (restore source and deploy target)'
        run: |
          git clone -q --depth 1 "https://github.com/${PAGES_REPO}.git" "$RUNNER_TEMP/site"
          echo "live site: $(git -C "$RUNNER_TEMP/site" log -1 --format='%h %cI %s')"

      - name: 'Restore the previous deploy''s payloads and stores'
        run: |
          uv run --frozen python scripts/ci_site.py restore --site paddock --prev "$RUNNER_TEMP/site"

      - name: 'Seed the working set if the cache was cold'
        id: seed
        timeout-minutes: 40
        env:
          STORES_DEPLOY_KEY: ${{ secrets.STORES_DEPLOY_KEY }}
          STORES_REPO: ${{ vars.STORES_REPO || 'pchattani/quant-sports-stores' }}
        run: |
          uv run --frozen python scripts/ci_site.py seed --site paddock | tee "$RUNNER_TEMP/seed.out"
          grep -E "^seeded=(true|false)$" "$RUNNER_TEMP/seed.out" >> "$GITHUB_OUTPUT" || echo "seeded=false" >> "$GITHUB_OUTPUT"

      - name: 'Fetch new rounds (Jolpica)'
        continue-on-error: true
        timeout-minutes: 8
        run: |
          uv run --frozen python scripts/f1_fetch.py --refresh-current --budget 120 --interval 1.0

      - name: 'Fetch new sessions and telemetry (OpenF1)'
        continue-on-error: true
        timeout-minutes: 25
        run: |
          uv run --frozen python scripts/f1_openf1.py --from ${{ steps.ctx.outputs.year }} --to ${{ steps.ctx.outputs.year }} --telemetry --budget 3000

      - name: 'Summarise telemetry'
        continue-on-error: true
        timeout-minutes: 10
        run: |
          uv run --frozen python scripts/f1_telemetry.py --from ${{ steps.ctx.outputs.year }} --to ${{ steps.ctx.outputs.year }}

      - name: 'Build'
        timeout-minutes: 30
        run: |
          uv run --frozen python scripts/build_paddock.py

      - name: 'Completeness guard (refuse to deploy from an incomplete working set)'
        run: |
          uv run --frozen python scripts/ci_site.py guard --site paddock

      - name: 'Deploy'
        if: ${{ env.DEPLOY == 'true' }}
        env:
          DEPLOY_KEY: ${{ secrets.PADDOCK_DEPLOY_KEY }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then echo "::error::PADDOCK_DEPLOY_KEY not set"; exit 1; fi
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          git -C "$RUNNER_TEMP/site" remote set-url origin "git@github.com:${PAGES_REPO}.git"
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes"
          uv run --frozen python scripts/ci_site.py deploy --site paddock --clone "$RUNNER_TEMP/site"

      - name: 'Shadow run: compare with the live site'
        if: ${{ env.DEPLOY != 'true' }}
        run: |
          uv run --frozen python scripts/ci_site.py deploy --site paddock --clone "$RUNNER_TEMP/site" --shadow "$RUNNER_TEMP/shadow"

      - name: 'Upload the shadow report'
        if: ${{ env.DEPLOY != 'true' && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: shadow-paddock-${{ github.run_id }}
          path: ${{ runner.temp }}/shadow
          retention-days: 3
          if-no-files-found: ignore

      - name: 'Raw data content key'
        if: ${{ !cancelled() }}
        id: rawkey
        run: |
          uv run --frozen python scripts/ci_site.py cachekey --name paddock-raw-v1 --paths data/f1/telemetry | tee -a "$GITHUB_OUTPUT"

      - name: 'Save raw data (only when it changed)'
        if: ${{ !cancelled() && steps.rawkey.outputs.files != '0' && steps.rawkey.outputs.key != steps.raw.outputs.cache-matched-key }}
        uses: actions/cache/save@v4
        with:
          path: |
            data/f1/telemetry
          key: ${{ steps.rawkey.outputs.key }}

      - name: 'Save model caches (once a day, and after a seed)'
        if: ${{ !cancelled() && (steps.model.outputs.cache-hit != 'true' || steps.seed.outputs.seeded == 'true') }}
        uses: actions/cache/save@v4
        with:
          path: |
            data/f1/cache
          key: paddock-model-v1-${{ steps.ctx.outputs.today }}${{ steps.seed.outputs.seeded == 'true' && format('-seed-{0}', github.run_id) || '' }}
