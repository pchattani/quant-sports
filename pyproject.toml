[project]
name = "oddsmarkets"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9",
    "apscheduler>=3.10",
    "duckdb>=0.10",
    "rapidfuzz>=3.6",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "dash>=2.14",
    "dash-bootstrap-components>=1.5",
    "requests>=2.31",
    "plotly>=5.20",
    "pandas>=2.0",
    "scipy>=1.12",
    "numpy>=1.26",
    "betfairlightweight>=2.10",
    "pynacl>=1.6.2",
    "datafc>=2.7.0",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "pyarrow>=15.0",
    "lightgbm>=4.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["oddsmarkets"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pdfplumber>=0.11.10",
    "pytest>=8.0",
]
